[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/board"
  to = "/Alpha_Board_v5.0_mobile.html"
  status = 200

[[redirects]]
  from = "/portal"
  to = "/Alpha_Portal.html"
  status = 200

[[redirects]]
  from = "/cards"
  to = "/Alpha_ProspectCards.html"
  status = 200

[[redirects]]
  from = "/buzz"
  to = "/Alpha_BuzzFeed.html"
  status = 200

[[redirects]]
  from = "/methodology"
  to = "/methodology.html"
  status = 200

[[redirects]]
  from = "/how"
  to = "/methodology.html"
  status = 200

# the Sleeper Roster Manager now lives inside the Command Center
[[redirects]]
  from = "/sleeper"
  to = "/command.html"
  status = 301

[[redirects]]
  from = "/tools"
  to = "/tools.html"
  status = 200

[[redirects]]
  from = "/command"
  to = "/command.html"
  status = 200

# old name of the Command Center — keep shared links working
[[redirects]]
  from = "/fantrax"
  to = "/command.html"
  status = 301

[[redirects]]
  from = "/fantrax.html"
  to = "/command.html"
  status = 301
