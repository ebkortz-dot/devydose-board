<title>PadKeys</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one-screen instrument. Top bar, then pads + three assignable controls, keyboard along the bottom edge. */
:root{
  color-scheme:dark;
  --bg:#14161b; --panel:#20242c; --panel-hi:#2c313b; --line:#3a404c;
  --fg:#e9e9ec; --dim:#8b909b; --accent:#ffb020; --on-accent:#17130a;
  --kick:#ff5a4d; --snare:#ffb020; --hat:#37c8d8; --tom:#9a7bff; --perc:#5fd068; --zap:#ff6fb5;
  --white-key:#f2f0ea; --black-key:#17191e; --key-line:#50545c;
  --ui:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-weight:700;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;min-height:430px;display:flex;flex-direction:column;gap:8px;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.brand{color:var(--accent);font-size:18px;letter-spacing:.04em;margin-right:4px}
.seg{display:flex;background:var(--panel);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:8px 12px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.btn{border:0;background:var(--panel);border-radius:8px;padding:9px 12px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.btn.on{background:var(--accent);color:var(--on-accent)}
.vol{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);letter-spacing:.06em;margin-left:auto}
.vol input{width:110px;accent-color:var(--accent)}
.status{font-size:12px;letter-spacing:.04em;color:var(--on-accent);background:var(--accent);border-radius:999px;padding:6px 12px;border:0;cursor:pointer}

.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.top{flex:1.15;min-height:0;display:flex;gap:8px}
.bank{writing-mode:vertical-rl;transform:rotate(180deg);padding:8px 10px;flex:none}
.pads{flex:1;min-width:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:6px}
.pad{position:relative;border-radius:10px;border:1px solid var(--c);background:linear-gradient(color-mix(in srgb,var(--c) 42%,#000),color-mix(in srgb,var(--c) 26%,#000));
  touch-action:none;cursor:pointer;display:flex;align-items:flex-end;padding:6px 8px;font-size:13px;letter-spacing:.03em;text-transform:uppercase;min-height:44px;overflow:hidden}
.pad span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pad.hit{background:var(--c);color:var(--on-accent);transition:none}
.pad{transition:background .25s,color .25s}

.ctl{flex:none;width:min(38%,360px);display:flex;gap:8px}
.unit{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.unit.slim{flex:.8}
.dial,.vslider{flex:1;min-height:0;touch-action:none;cursor:grab;position:relative}
.dial svg{position:absolute;inset:0;width:100%;height:100%}
.dial .trk{stroke:var(--panel-hi)} .dial .val{stroke:var(--accent)} .dial .cap{fill:#3a404b} .dial .ptr{stroke:var(--fg)}
.vslider .trk{position:absolute;left:50%;top:6px;bottom:6px;width:12px;margin-left:-6px;border-radius:6px;background:var(--panel-hi)}
.vslider .fill{position:absolute;left:50%;width:12px;margin-left:-6px;border-radius:6px;background:var(--accent)}
.vslider .thumb{position:absolute;left:50%;width:44px;height:18px;margin:-9px 0 0 -22px;border-radius:5px;background:var(--fg)}
.vslider .thumb::after{content:"";position:absolute;left:9px;right:9px;top:8px;height:2px;background:var(--bg)}
.unit select{background:var(--panel-hi);border:0;border-radius:7px;padding:7px 4px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;text-align:center;text-align-last:center;width:100%;min-width:0}
.readout{font-size:11px;color:var(--dim);text-align:center;letter-spacing:.04em;font-variant-numeric:tabular-nums;height:13px}

.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.row .lab{font-size:12px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.keys{flex:1;min-height:96px;position:relative;border-radius:8px;overflow:hidden;touch-action:none;background:var(--key-line)}
.key{position:absolute;top:0;bottom:0;background:var(--white-key);border-right:1px solid var(--key-line);box-sizing:border-box;border-radius:0 0 4px 4px}
.key b{position:absolute;left:5px;bottom:4px;font-size:10px;color:#6b6f78;font-weight:500}
.key.blk{background:var(--black-key);bottom:40%;border:0;border-radius:0 0 4px 4px;z-index:2}
.key.down{background:var(--accent)}

.grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(52px,84px) repeat(16,1fr);grid-auto-rows:1fr;gap:3px;touch-action:none}
.grid .name{background:var(--panel);border-radius:4px;display:flex;align-items:center;padding:0 6px;font-size:11px;text-transform:uppercase;overflow:hidden;white-space:nowrap;cursor:pointer}
.cell{background:var(--panel);border-radius:3px;min-height:18px;cursor:pointer}
.cell.beat{background:var(--panel-hi)}
.cell.on{background:var(--c)}
.cell.now{filter:brightness(1.5)}
.row input[type=range]{accent-color:var(--accent);width:120px}
.num{font-variant-numeric:tabular-nums;font-size:12px;min-width:30px}
.hint{font-size:12px;color:var(--dim);font-weight:500;margin:0}

@media (max-width:640px){
  .app{height:auto;min-height:100%}
  .top{flex-direction:column;flex:none}
  .bank{writing-mode:horizontal-tb;transform:none;align-self:flex-start}
  .pads{min-height:150px}
  .ctl{width:100%;height:150px}
  .keys{flex:none;height:150px}
  .grid{min-height:260px}
  .brand{display:none}
}
@media (prefers-reduced-motion:reduce){.pad{transition:none}}
</style>

<div class="app">
  <header class="bar">
    <div class="brand">PADKEYS</div>
    <div class="seg" id="tabs" role="tablist">
      <button id="tab-play" class="on" data-tab="play">Play</button>
      <button id="tab-steps" data-tab="steps">Steps</button>
    </div>
    <button class="btn" id="run">&#9654; Beat</button>
    <button class="status" id="status">Tap here to turn sound on</button>
    <label class="vol" for="vol">VOL <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8"></label>
  </header>

  <section class="view" id="view-play">
    <div class="top">
      <button class="btn bank" id="bank">Pads 1-8</button>
      <div class="pads" id="pads"></div>
      <div class="ctl">
        <div class="unit"><div class="dial" id="ctl0" tabindex="0"></div><div class="readout" id="read0"></div><select id="assign0" aria-label="Dial 1 controls"></select></div>
        <div class="unit"><div class="dial" id="ctl1" tabindex="0"></div><div class="readout" id="read1"></div><select id="assign1" aria-label="Dial 2 controls"></select></div>
        <div class="unit slim"><div class="vslider" id="ctl2" tabindex="0"><div class="trk"></div><div class="fill"></div><div class="thumb"></div></div><div class="readout" id="read2"></div><select id="assign2" aria-label="Slider controls"></select></div>
      </div>
    </div>
    <div class="row">
      <span class="lab">Sound</span>
      <div class="seg" id="sounds"></div>
      <span class="lab">Octave</span>
      <div class="seg"><button id="octDown" aria-label="Octave down">&minus;</button><button id="octUp" aria-label="Octave up">+</button></div>
    </div>
    <div class="keys" id="keys"></div>
  </section>

  <section class="view" id="view-steps" hidden>
    <div class="grid" id="grid"></div>
    <div class="row">
      <button class="btn" id="bank2">Pads 1-8</button>
      <label class="lab" for="tempo">Tempo</label><input type="range" id="tempo" min="60" max="200" step="1" value="110"><span class="num" id="tempoNum">110</span>
      <label class="lab" for="swing">Swing</label><input type="range" id="swing" min="0" max="1" step="0.01" value="0">
      <button class="btn" id="clear">Clear</button>
      <p class="hint">Tap squares to build a beat, then press Beat.</p>
    </div>
  </section>
</div>

<script>
// ---------------------------------------------------------------- sound engine
// Same recipes as the native instrument. Runs on the audio thread when the browser allows it.
function engineFactory(sr){
  const TAU=6.283185307179586;
  class SVF{
    constructor(){this.ic1=0;this.ic2=0;this.k=1;this.a1=0;this.a2=0;this.a3=0;this.lp=0;this.bp=0;this.hp=0;}
    set(f,q){f=Math.min(Math.max(f,20),sr*0.45);const g=Math.tan(Math.PI*f/sr);this.k=1/q;this.a1=1/(1+g*(g+this.k));this.a2=g*this.a1;this.a3=g*this.a2;}
    reset(){this.ic1=0;this.ic2=0;}
    tick(x){const v3=x-this.ic2,v1=this.a1*this.ic1+this.a2*v3,v2=this.ic2+this.a2*this.ic1+this.a3*v3;this.ic1=2*v1-this.ic1;this.ic2=2*v2-this.ic2;this.lp=v2;this.bp=v1;this.hp=x-this.k*v1-v2;}
  }
  const P={master:.8,wave:0,cutoff:3500,reso:.2,attack:.005,decay:.35,sustain:.6,release:.3,fat:.4,keysLevel:.7,
           fxFilter:0,delayMix:0,delayFb:.4,delayTime:2,tempo:110,swing:0};
  const padTune=new Float32Array(16),padDecay=new Float32Array(16).fill(1),padLevel=new Float32Array(16).fill(.8);
  const PAN=[0,-.15,0,.1,0,-.35,.25,0,-.3,.35,.25,-.25,.3,-.2,.15,.3];
  const METAL=[205.3,304.4,369.6,522.7,540,800];
  const pattern=new Uint16Array(16);
  let seqOn=false,ppq=0,clock=0;
  const api={onStep:null};

  class Drum{
    constructor(type){this.type=type;this.active=false;this.pending=-1;this.pv=0;this.ph=new Float32Array(6);this.f=new SVF();
      this.rng=0x12345678;this.amp=0;this.penv=0;this.nenv=0;this.ac=0;this.pc=0;this.nc=0;this.n=0;this.gain=0;this.tune=1;}
    coef(s){return Math.exp(-1/(Math.max(.0005,s)*sr));}
    noise(){let r=this.rng;r^=r<<13;r^=r>>>17;r^=r<<5;this.rng=r;return (r|0)/2147483648;}
    sine(i,f){let p=this.ph[i]+f/sr;if(p>=1)p-=1;this.ph[i]=p;return Math.sin(TAU*p);}
    square(i,f){let p=this.ph[i]+f/sr;if(p>=1)p-=1;this.ph[i]=p;return p<.5?1:-1;}
    metal(scale){let s=0;for(let i=0;i<6;i++)s+=this.square(i,METAL[i]*scale*this.tune);return s/6;}
    trigger(v,delay){this.pv=v;this.pending=Math.max(0,delay|0);}
    choke(){if(this.active)this.ac=this.coef(.006);}
    start(v){
      const t=this.type,d=padDecay[t];this.tune=Math.pow(2,padTune[t]/12);const tu=this.tune;
      this.active=true;this.n=0;this.amp=this.penv=this.nenv=1;this.ph.fill(0);this.f.reset();this.gain=v*v*padLevel[t];
      let a=.2,p=.03,nz=.01;
      switch(t){
        case 0:a=.26;p=.03;nz=.004;break;
        case 4:a=.85;p=.05;nz=.003;break;
        case 2:a=.085;p=.02;nz=.15;this.f.set(1800,.7);break;
        case 1:a=.02;p=.01;nz=.008;this.f.set(2600,2);break;
        case 3:a=.13;nz=.13;this.f.set(1150*tu,2.2);break;
        case 5:a=.36;p=.06;nz=.005;break;
        case 7:a=.30;p=.055;nz=.005;break;
        case 9:a=.25;p=.05;nz=.005;break;
        case 6:a=.035;this.f.set(7000,.8);break;
        case 10:a=.3;this.f.set(7000,.8);break;
        case 8:a=.05;this.f.set(5200,.9);break;
        case 11:a=.22;p=.015;this.f.set(800*tu,3);break;
        case 12:a=.032;break;
        case 13:a=1.1;this.f.set(3600,.7);break;
        case 15:a=.7;p=.02;this.f.set(6200,1.2);break;
        case 14:a=.15;p=.04;break;
      }
      this.ac=this.coef(a*d);this.pc=this.coef(t===14?p*d:p);this.nc=this.coef((t===2||t===3)?nz*d:nz);
    }
    tom(freq){return (this.sine(0,freq*this.tune*(1+.8*this.penv))*this.amp+this.noise()*this.nenv*.15)*.85;}
    render(){
      const tu=this.tune,amp=this.amp,penv=this.penv,nenv=this.nenv,f=this.f;
      switch(this.type){
        case 0:return Math.tanh((this.sine(0,50*tu*(1+3.6*penv))*amp+this.noise()*nenv*.25)*1.6)*.95;
        case 4:return Math.tanh((this.sine(0,43*tu*(1+2.2*penv))*amp+this.noise()*nenv*.15)*2.2)*.85;
        case 2:{const body=(this.sine(0,185*tu*(1+.5*penv))*.6+this.sine(1,330*tu)*.35)*amp;f.tick(this.noise());return body*.8+f.hp*nenv*.55;}
        case 1:{f.tick(this.noise());return (this.sine(0,1750*tu)*.5+this.sine(1,480*tu)*.5)*amp+f.bp*nenv*.5;}
        case 3:{const t=this.n/sr;const env=t<.033?Math.exp(-(t%.011)/.004):amp*1.3;f.tick(this.noise());return f.bp*env*1.3;}
        case 5:return this.tom(88);
        case 7:return this.tom(128);
        case 9:return this.tom(178);
        case 6:case 10:f.tick(this.metal(1)*.8+this.noise()*.25);return f.hp*amp*1.7;
        case 8:{const att=Math.min(1,this.n/(.008*sr));f.tick(this.noise());return f.hp*amp*att*.6;}
        case 11:f.tick(this.square(0,540*tu)+this.square(1,800*tu));return f.bp*(.6*penv+.4*amp)*.24;
        case 12:return this.sine(0,2500*tu)*amp*.7;
        case 13:f.tick(this.metal(1.5)*.6+this.noise()*.5);return f.hp*amp*.75;
        case 15:f.tick(this.metal(2.1));return (f.bp*.9+f.hp*.3)*(.5*penv+.5*amp)*1.5;
        case 14:return this.sine(0,90*tu+5000*penv*penv)*amp*.6;
      }
      return 0;
    }
    tick(){
      if(this.pending>=0&&this.pending--===0)this.start(this.pv);
      if(!this.active)return 0;
      const out=this.render()*this.gain;
      this.amp*=this.ac;this.penv*=this.pc;this.nenv*=this.nc;this.n++;
      if(this.amp<1e-4&&this.n>64)this.active=false;
      return out;
    }
  }

  function blep(t,dt){if(t<dt){t/=dt;return t+t-t*t-1;}if(t>1-dt){t=(t-1)/dt;return t*t+t+t+1;}return 0;}
  function osc(w,p,dt){
    switch(w){
      case 0:return 2*p-1-blep(p,dt);
      case 1:{let t2=p+.5;if(t2>=1)t2-=1;return (p<.5?1:-1)+blep(p,dt)-blep(t2,dt);}
      case 2:return 4*Math.abs(p-.5)-1;
      default:return Math.sin(TAU*p);
    }
  }
  class Voice{
    constructor(){this.note=-1;this.state=0;this.env=0;this.f=new SVF();this.p1=0;this.p2=.37;this.freq=440;this.vel=1;this.age=0;}
    on(note,v){this.note=note;this.freq=440*Math.pow(2,(note-69)/12);this.vel=.25+.75*v;
      if(this.state===0){this.f.reset();this.p1=0;this.p2=.37;this.env=0;}this.state=1;this.age=++clock;}
    off(){if(this.state!==0)this.state=4;}
    render(L,R,n){
      if(this.state===0)return;
      const w=P.wave|0,q=.6+P.reso*7,det=Math.pow(2,P.fat*22/1200),lvl=P.keysLevel*this.vel*.4;
      const dt1=this.freq*det/sr,dt2=this.freq/det/sr,sus=P.sustain;
      const aR=1/(Math.max(.002,P.attack)*sr),dR=(1-sus)/(Math.max(.005,P.decay)*sr),rR=1/(Math.max(.005,P.release)*sr);
      const f=this.f;let env=this.env,p1=this.p1,p2=this.p2,st=this.state;
      for(let i=0;i<n;i++){
        if(st===1){env+=aR;if(env>=1){env=1;st=2;}}
        else if(st===2){env-=dR;if(env<=sus){env=sus;st=3;}}
        else if(st===4){env-=rR;if(env<=0){env=0;st=0;this.note=-1;break;}}
        if((i&15)===0)f.set(P.cutoff*(.3+.7*env),q);
        p1+=dt1;if(p1>=1)p1-=1;p2+=dt2;if(p2>=1)p2-=1;
        f.tick(.5*(osc(w,p1,dt1)+osc(w,p2,dt2)));
        const o=f.lp*env*lvl;L[i]+=o;R[i]+=o;
      }
      this.env=env;this.p1=p1;this.p2=p2;this.state=st;
    }
  }

  const drums=[];for(let i=0;i<16;i++)drums.push(new Drum(i));
  const voices=[];for(let i=0;i<10;i++)voices.push(new Voice());
  const dlen=Math.floor(sr*2.5)+8,dl=[new Float32Array(dlen),new Float32Array(dlen)];
  let dw=0,dcur=sr*.3,fpos=0,mcur=.8;const fx=[new SVF(),new SVF()];
  const BEATS=[.25,.5,.75,1];

  function hitPad(i,v,off){if(i===6)drums[10].choke();drums[i].trigger(v,off);}
  function noteOn(n,v){let best=null;for(const vc of voices){if(vc.state===0){best=vc;break;}if(!best||vc.age<best.age)best=vc;}best.on(n,v);}
  function noteOff(n){for(const vc of voices)if(vc.note===n&&vc.state!==4)vc.off();}

  api.handle=function(m){
    switch(m.t){
      case 'pad':hitPad(m.i,m.v,0);break;
      case 'on':noteOn(m.n,m.v);break;
      case 'off':noteOff(m.n);break;
      case 'param':P[m.k]=m.v;break;
      case 'pattern':for(let i=0;i<16;i++)pattern[i]=m.p[i];break;
      case 'seq':seqOn=m.on;if(!seqOn){ppq=0;if(api.onStep)api.onStep(-1);}break;
    }
  };

  api.process=function(L,R,n){
    for(let i=0;i<n;i++){L[i]=0;R[i]=0;}
    if(seqOn){
      const pps=P.tempo/(60*sr),end=ppq+n*pps,sw=P.swing*.25/3;
      for(let k=Math.floor(ppq*4)-1;k<=Math.floor(end*4);k++){
        const sp=k*.25+((k&1)?sw:0);
        if(sp<ppq||sp>=end)continue;
        const step=((k%16)+16)%16,off=Math.min(n-1,Math.max(0,Math.floor((sp-ppq)/pps)));
        for(let p=0;p<16;p++)if((pattern[p]>>step)&1)hitPad(p,.85,off);
        if(api.onStep)api.onStep(step);
      }
      ppq=end;
    }
    for(let p=0;p<16;p++){
      const d=drums[p];if(!d.active&&d.pending<0)continue;
      const gl=1-Math.max(0,PAN[p]),gr=1+Math.min(0,PAN[p]);
      for(let i=0;i<n;i++){const s=d.tick();L[i]+=s*gl;R[i]+=s*gr;}
    }
    for(const v of voices)v.render(L,R,n);

    const want=Math.min(dlen-8,Math.max(16,BEATS[P.delayTime|0]*60/Math.max(30,P.tempo)*sr));
    const mix=P.delayMix,fb=P.delayFb;
    for(let i=0;i<n;i++){
      dcur+=(want-dcur)*.0002;
      let rp=dw-dcur;if(rp<0)rp+=dlen;const i0=rp|0,i1=(i0+1)%dlen,fr=rp-i0;
      fpos+=(P.fxFilter-fpos)*.002;mcur+=(P.master-mcur)*.002;
      const fon=Math.abs(fpos)>.02;
      if(fon&&(i&15)===0){const fq=fpos<0?18000*Math.pow(.006,-fpos):30*Math.pow(200,fpos);fx[0].set(fq,1.1);fx[1].set(fq,1.1);}
      const g=mcur*mcur*1.4;
      for(let ch=0;ch<2;ch++){
        const buf=ch?R:L,line=dl[ch],dry=buf[i],echo=line[i0]+fr*(line[i1]-line[i0]);
        line[dw]=dry+echo*fb;
        let o=dry+echo*mix;
        if(fon){fx[ch].tick(o);o=fpos<0?fx[ch].lp:fx[ch].hp;}
        o*=g;const mag=Math.abs(o);
        buf[i]=mag<=.7?o:Math.sign(o)*(.7+.3*Math.tanh((mag-.7)/.3));
      }
      if(++dw>=dlen)dw=0;
    }
  };
  return api;
}

// ---------------------------------------------------------------- audio plumbing
let ctx=null,post=null,starting=false;
const queue=[];
function send(m){if(post)post(m);else if(m.t!=='pad'&&m.t!=='on'&&m.t!=='off')queue.push(m);}
function onStep(s){curStep=s;stepDirty=true;}
async function startAudio(){
  if(ctx){if(ctx.state!=='running')ctx.resume();return;}
  if(starting)return;starting=true;
  const AC=window.AudioContext||window.webkitAudioContext;
  ctx=new AC({latencyHint:'interactive'});
  ctx.resume();
  let ok=false;
  if(ctx.audioWorklet&&window.AudioWorkletNode){
    try{
      const code='const make='+engineFactory.toString()+';class PK extends AudioWorkletProcessor{constructor(){super();this.e=make(sampleRate);this.e.onStep=s=>this.port.postMessage(s);this.port.onmessage=ev=>this.e.handle(ev.data);}process(i,o){const c=o[0];this.e.process(c[0],c[1]||c[0],c[0].length);return true;}}registerProcessor("padkeys",PK);';
      const url=URL.createObjectURL(new Blob([code],{type:'application/javascript'}));
      await ctx.audioWorklet.addModule(url);
      const node=new AudioWorkletNode(ctx,'padkeys',{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[2]});
      node.port.onmessage=ev=>onStep(ev.data);
      node.connect(ctx.destination);
      post=m=>node.port.postMessage(m);ok=true;
    }catch(e){ok=false;}
  }
  if(!ok){
    const eng=engineFactory(ctx.sampleRate);eng.onStep=onStep;
    const node=ctx.createScriptProcessor(512,0,2);
    node.onaudioprocess=ev=>{const b=ev.outputBuffer;eng.process(b.getChannelData(0),b.getChannelData(1),b.length);};
    node.connect(ctx.destination);window.__pkNode=node;
    post=m=>eng.handle(m);
  }
  queue.forEach(post);queue.length=0;
  ctx.onstatechange=showStatus;showStatus();
}
function showStatus(){document.getElementById('status').hidden=!!ctx&&ctx.state==='running';}
['touchend','pointerup','click','keydown'].forEach(ev=>document.addEventListener(ev,startAudio,{passive:true}));

// ---------------------------------------------------------------- data
const PADS=[['Kick','kick'],['Rim','snare'],['Snare','snare'],['Clap','snare'],['Sub Kick','kick'],['Low Tom','tom'],['Hat','hat'],['Mid Tom','tom'],
            ['Shaker','perc'],['High Tom','tom'],['Open Hat','hat'],['Cowbell','perc'],['Clave','perc'],['Crash','hat'],['Zap','zap'],['Ride','hat']];
const pattern=[0x0581,0,0x1010,0,0,0,0x5555,0,0,0,0x4000,0,0,0,0,0];
// Things a dial or the slider can be pointed at: [param, label, min, max, curve, format]
const TARGETS=[
  ['cutoff','Tone',60,18000,'log',v=>Math.round(v)+' Hz'],['reso','Edge',0,1,'lin',pct],['fat','Fat',0,1,'lin',pct],
  ['attack','Attack',.002,2,'log',sec],['release','Release',.01,4,'log',sec],['keysLevel','Keys Level',0,1,'lin',pct],
  ['fxFilter','Sweep Filter',-1,1,'lin',v=>Math.abs(v)<.02?'off':(v<0?'muffle ':'thin ')+Math.round(Math.abs(v)*100)],
  ['delayMix','Echo',0,1,'lin',pct],['delayFb','Echo Repeats',0,.85,'lin',pct],['swing','Swing',0,1,'lin',pct],
  ['tempo','Tempo',60,200,'lin',v=>Math.round(v)+' bpm'],['master','Volume',0,1,'lin',pct]];
function pct(v){return Math.round(v*100)+'%';}
function sec(v){return v<1?Math.round(v*1000)+' ms':v.toFixed(2)+' s';}
const values={master:.8,wave:0,cutoff:3500,reso:.2,attack:.005,decay:.35,sustain:.6,release:.3,fat:.4,keysLevel:.7,fxFilter:0,delayMix:0,delayFb:.4,tempo:110,swing:0};
const SOUNDS=[
  ['Lead',{wave:0,cutoff:3500,reso:.2,attack:.005,decay:.35,sustain:.6,release:.3,fat:.4}],
  ['Pad',{wave:0,cutoff:1300,reso:.1,attack:.45,decay:1,sustain:.8,release:1.6,fat:.85}],
  ['Pluck',{wave:1,cutoff:2400,reso:.35,attack:.002,decay:.2,sustain:0,release:.22,fat:.2}],
  ['Bass',{wave:2,cutoff:900,reso:.3,attack:.003,decay:.25,sustain:.55,release:.12,fat:.15}],
  ['Organ',{wave:3,cutoff:9000,reso:0,attack:.005,decay:.1,sustain:1,release:.08,fat:.55}]];
const assign=['cutoff','delayMix','fxFilter'];
let bank=0,octave=0,curStep=-1,stepDirty=false,running=false;
const $=id=>document.getElementById(id);
function target(k){return TARGETS.find(t=>t[0]===k);}
function toNorm(t,v){return t[4]==='log'?Math.log(v/t[2])/Math.log(t[3]/t[2]):(v-t[2])/(t[3]-t[2]);}
function fromNorm(t,x){return t[4]==='log'?t[2]*Math.pow(t[3]/t[2],x):t[2]+x*(t[3]-t[2]);}
function setParam(k,v){values[k]=v;send({t:'param',k,v});syncControls();
  if(k==='master')$('vol').value=v;if(k==='tempo'){$('tempo').value=v;$('tempoNum').textContent=Math.round(v);}if(k==='swing')$('swing').value=v;}

// ---------------------------------------------------------------- assignable controls
const ARC='M 22.4 77.6 A 39 39 0 1 1 77.6 77.6';
function drawControl(i){
  const t=target(assign[i]),x=Math.min(1,Math.max(0,toNorm(t,values[t[0]]))),el=$('ctl'+i);
  $('read'+i).textContent=t[5](values[t[0]]);
  if(i<2){
    el.querySelector('.val').setAttribute('stroke-dasharray',(x*100)+' 100');el.querySelector('.val').style.visibility=x<.005?'hidden':'visible';
    el.querySelector('.ptr').setAttribute('transform','rotate('+(-135+270*x)+' 50 50)');
  }else{
    const h=el.clientHeight-12,y=6+(1-x)*h,fill=el.querySelector('.fill');
    el.querySelector('.thumb').style.top=y+'px';
    if(t[0]==='fxFilter'){const mid=6+h/2;fill.style.top=Math.min(y,mid)+'px';fill.style.height=Math.abs(y-mid)+'px';}
    else{fill.style.top=y+'px';fill.style.height=(6+h-y)+'px';}
  }
}
function syncControls(){for(let i=0;i<3;i++)drawControl(i);}
function setupControl(i){
  const el=$('ctl'+i),sel=$('assign'+i);
  if(i<2)el.innerHTML='<svg viewBox="0 0 100 100" aria-hidden="true"><path class="trk" d="'+ARC+'" fill="none" stroke-width="7" stroke-linecap="round"/><path class="val" d="'+ARC+'" fill="none" stroke-width="7" stroke-linecap="round" pathLength="100"/><circle class="cap" cx="50" cy="50" r="27"/><line class="ptr" x1="50" y1="26" x2="50" y2="38" stroke-width="5" stroke-linecap="round"/></svg>';
  TARGETS.forEach(t=>{const o=document.createElement('option');o.value=t[0];o.textContent=t[1];sel.appendChild(o);});
  sel.value=assign[i];
  sel.addEventListener('change',()=>{assign[i]=sel.value;drawControl(i);});
  let startY=0,startX=0,startV=0,active=false;
  const apply=x=>{const t=target(assign[i]);setParam(t[0],fromNorm(t,Math.min(1,Math.max(0,x))));};
  el.addEventListener('pointerdown',e=>{
    el.setPointerCapture(e.pointerId);active=true;startY=e.clientY;startX=e.clientX;
    const t=target(assign[i]);
    if(i===2){const r=el.getBoundingClientRect();apply(1-(e.clientY-r.top-6)/(r.height-12));}
    startV=toNorm(t,values[t[0]]);startY=e.clientY;
  });
  el.addEventListener('pointermove',e=>{if(!active)return;
    apply(i===2?startV+(startY-e.clientY)/(el.clientHeight-12):startV+((startY-e.clientY)+(e.clientX-startX))/220);});
  const end=()=>{active=false;};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  el.addEventListener('dblclick',()=>{const t=target(assign[i]);const d={cutoff:3500,reso:.2,fat:.4,attack:.005,release:.3,keysLevel:.7,fxFilter:0,delayMix:0,delayFb:.4,swing:0,tempo:110,master:.8};setParam(t[0],d[t[0]]);});
  el.addEventListener('keydown',e=>{const t=target(assign[i]);const x=toNorm(t,values[t[0]]);
    if(e.key==='ArrowUp'||e.key==='ArrowRight'){apply(x+.03);e.preventDefault();}
    if(e.key==='ArrowDown'||e.key==='ArrowLeft'){apply(x-.03);e.preventDefault();}});
}

// ---------------------------------------------------------------- pads
const padEls=[];
function buildPads(){
  const box=$('pads');box.innerHTML='';padEls.length=0;
  // bottom row first visually = pads 1-4, like a drum machine
  [4,5,6,7,0,1,2,3].forEach(j=>{
    const p=bank*8+j,el=document.createElement('button');
    el.className='pad';el.id='pad'+j;el.style.setProperty('--c','var(--'+PADS[p][1]+')');
    el.innerHTML='<span>'+PADS[p][0]+'</span>';
    el.addEventListener('pointerdown',e=>{
      e.preventDefault();startAudio();
      const r=el.getBoundingClientRect();
      const v=Math.min(1,Math.max(.5,1.05-.55*(e.clientY-r.top)/r.height));
      send({t:'pad',i:p,v});flash(el);
    });
    box.appendChild(el);padEls[p]=el;
  });
  $('bank').textContent=$('bank2').textContent=bank?'Pads 9-16':'Pads 1-8';
}
function flash(el){el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),70);}

// ---------------------------------------------------------------- keyboard
const WHITE=[0,2,4,5,7,9,11],HAS_SHARP=[1,1,0,1,1,1,0],held=new Map();
function buildKeys(){
  const box=$('keys'),W=box.clientWidth;if(!W)return;
  const n=Math.max(8,Math.min(22,Math.floor(W/46))),kw=W/n,base=48+12*octave;
  box.innerHTML='';
  for(let w=0;w<n;w++){
    const note=base+WHITE[w%7]+12*Math.floor(w/7),k=document.createElement('div');
    k.className='key';k.dataset.note=note;k.style.left=(w*kw)+'px';k.style.width=kw+'px';
    if(w%7===0)k.innerHTML='<b>C'+(Math.floor(note/12)-2)+'</b>';
    box.appendChild(k);
    if(HAS_SHARP[w%7]&&w<n-1){const b=document.createElement('div');b.className='key blk';b.dataset.note=note+1;
      b.style.left=((w+1)*kw-kw*.3)+'px';b.style.width=(kw*.6)+'px';box.appendChild(b);}
  }
}
function keyAt(e){const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.classList.contains('key')?el:null;}
function press(id,el,e){
  release(id);if(!el)return;
  const r=el.getBoundingClientRect(),v=Math.min(1,Math.max(.45,.45+.6*(e.clientY-r.top)/r.height));
  held.set(id,el);el.classList.add('down');send({t:'on',n:+el.dataset.note,v});
}
function release(id){const el=held.get(id);if(!el)return;held.delete(id);
  let still=false;held.forEach(o=>{if(o===el)still=true;});
  if(!still){el.classList.remove('down');send({t:'off',n:+el.dataset.note});}}
function setupKeys(){
  const box=$('keys');
  box.addEventListener('pointerdown',e=>{e.preventDefault();startAudio();try{box.setPointerCapture(e.pointerId);}catch(_){ }press(e.pointerId,keyAt(e),e);});
  box.addEventListener('pointermove',e=>{if(!held.has(e.pointerId)&&e.buttons===0)return;const el=keyAt(e);if(el!==held.get(e.pointerId)&&(held.has(e.pointerId)||e.buttons))press(e.pointerId,el,e);});
  const up=e=>release(e.pointerId);
  box.addEventListener('pointerup',up);box.addEventListener('pointercancel',up);
}
function allOff(){held.forEach((el,id)=>release(id));}

// ---------------------------------------------------------------- steps
function buildGrid(){
  const g=$('grid');g.innerHTML='';
  for(let r=0;r<8;r++){
    const p=bank*8+r,name=document.createElement('div');
    name.className='name';name.textContent=PADS[p][0];
    name.addEventListener('pointerdown',()=>{startAudio();send({t:'pad',i:p,v:.85});});
    g.appendChild(name);
    for(let s=0;s<16;s++){
      const c=document.createElement('div');
      c.className='cell'+(Math.floor(s/4)%2===0?' beat':'')+((pattern[p]>>s)&1?' on':'');
      c.dataset.p=p;c.dataset.s=s;c.style.setProperty('--c','var(--'+PADS[p][1]+')');
      g.appendChild(c);
    }
  }
}
function setupGrid(){
  const g=$('grid');let paint=null;
  const toggle=e=>{
    const c=document.elementFromPoint(e.clientX,e.clientY);if(!c||!c.classList.contains('cell'))return;
    const p=+c.dataset.p,s=+c.dataset.s,on=(pattern[p]>>s)&1;
    if(paint===null)paint=!on;
    if(!!on===paint)return;
    pattern[p]=paint?pattern[p]|(1<<s):pattern[p]&~(1<<s);
    c.classList.toggle('on',paint);send({t:'pattern',p:pattern});
  };
  g.addEventListener('pointerdown',e=>{paint=null;toggle(e);});
  g.addEventListener('pointermove',e=>{if(paint!==null&&(e.buttons||e.pointerType==='touch'))toggle(e);});
  const end=()=>{paint=null;};
  g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
}
function frame(){
  if(stepDirty){
    stepDirty=false;
    document.querySelectorAll('.cell.now').forEach(c=>c.classList.remove('now'));
    if(curStep>=0){
      document.querySelectorAll('.cell[data-s="'+curStep+'"]').forEach(c=>c.classList.add('now'));
      for(let p=0;p<16;p++)if(((pattern[p]>>curStep)&1)&&padEls[p]&&padEls[p].isConnected)flash(padEls[p]);
    }
  }
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- wiring
function start(){
  for(let i=0;i<3;i++)setupControl(i);
  buildPads();buildGrid();setupGrid();setupKeys();buildKeys();syncControls();
  send({t:'pattern',p:pattern});
  SOUNDS.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s[0];b.id='sound'+i;if(i===0)b.className='on';
    b.addEventListener('click',()=>{document.querySelectorAll('#sounds button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
      Object.keys(s[1]).forEach(k=>setParam(k,s[1][k]));});
    $('sounds').appendChild(b);});
  document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
    $('view-play').hidden=b.dataset.tab!=='play';$('view-steps').hidden=b.dataset.tab!=='steps';
    allOff();buildKeys();syncControls();}));
  const flip=()=>{bank=1-bank;buildPads();buildGrid();};
  $('bank').addEventListener('click',flip);$('bank2').addEventListener('click',flip);
  $('run').addEventListener('click',()=>{running=!running;$('run').classList.toggle('on',running);
    $('run').innerHTML=running?'&#9632; Stop':'&#9654; Beat';send({t:'seq',on:running});});
  $('status').addEventListener('click',startAudio);
  $('vol').addEventListener('input',e=>setParam('master',+e.target.value));
  $('tempo').addEventListener('input',e=>setParam('tempo',+e.target.value));
  $('swing').addEventListener('input',e=>setParam('swing',+e.target.value));
  $('clear').addEventListener('click',()=>{pattern.fill(0);send({t:'pattern',p:pattern});buildGrid();});
  $('octDown').addEventListener('click',()=>{if(octave>-2){octave--;allOff();buildKeys();}});
  $('octUp').addEventListener('click',()=>{if(octave<3){octave++;allOff();buildKeys();}});
  window.addEventListener('resize',()=>{allOff();buildKeys();syncControls();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)allOff();});
  requestAnimationFrame(frame);
}
start();
</script>
